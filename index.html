<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Will You Be My Date? 💗</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: "Poppins", Arial, sans-serif;

            /* BACKGROUND PHOTO */
            background:
                linear-gradient(
                    rgba(255, 182, 205, 0.50),
                    rgba(255, 230, 240, 0.60)
                ),
                url("background.jpeg");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            overflow: hidden;
        }


        /* =========================
           FLOATING HEARTS
        ========================= */

        .heart {
            position: absolute;
            bottom: -50px;

            color: white;
            font-size: 24px;

            animation: floatUp linear infinite;

            opacity: 0.8;
            pointer-events: none;
        }

        .heart:nth-child(1) {
            left: 8%;
            animation-duration: 7s;
        }

        .heart:nth-child(2) {
            left: 20%;
            animation-duration: 9s;
            animation-delay: 2s;
        }

        .heart:nth-child(3) {
            left: 38%;
            animation-duration: 6s;
            animation-delay: 1s;
        }

        .heart:nth-child(4) {
            left: 62%;
            animation-duration: 8s;
            animation-delay: 3s;
        }

        .heart:nth-child(5) {
            left: 80%;
            animation-duration: 7s;
            animation-delay: 1.5s;
        }

        .heart:nth-child(6) {
            left: 92%;
            animation-duration: 10s;
            animation-delay: 4s;
        }


        @keyframes floatUp {

            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }

            20% {
                opacity: 0.8;
            }

            100% {
                transform:
                    translateY(-110vh)
                    rotate(360deg);

                opacity: 0;
            }
        }


        /* =========================
           MAIN CARD
        ========================= */

        .card {
            position: relative;
            z-index: 5;

            width: 90%;
            max-width: 430px;

            padding: 38px 25px;

            text-align: center;

            background: rgba(255, 255, 255, 0.90);

            border: 2px solid rgba(255, 255, 255, 0.9);

            border-radius: 35px;

            box-shadow:
                0 20px 60px rgba(150, 50, 90, 0.25);

            backdrop-filter: blur(10px);

            animation: cardAppear 0.8s ease;
        }


        @keyframes cardAppear {

            from {
                transform: scale(0.8);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }


        /* =========================
           TOP HEART
        ========================= */

        .top-heart {

            width: 85px;
            height: 85px;

            margin: 0 auto 15px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #ffe1eb;

            border-radius: 50%;

            font-size: 48px;

            animation: heartbeat 1.5s infinite;

            box-shadow:
                0 8px 25px rgba(231, 84, 128, 0.2);
        }


        @keyframes heartbeat {

            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.12);
            }
        }


        /* =========================
           TEXT
        ========================= */

        h1 {

            margin: 10px 0;

            color: #d94f7a;

            font-family: Georgia, serif;

            font-size: 31px;

            line-height: 1.2;
        }


        .subtitle {

            margin: 12px 0 28px;

            color: #777;

            font-size: 15px;

            line-height: 1.6;
        }


        /* =========================
           BUTTONS
        ========================= */

        .buttons {

            display: flex;

            justify-content: center;
            align-items: center;

            gap: 18px;

            min-height: 65px;

            position: relative;
        }


        button {

            border: none;

            border-radius: 50px;

            font-family: inherit;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition:
                all 0.35s ease;
        }


        /* YES */

        #yesBtn {

            background:
                linear-gradient(
                    135deg,
                    #e75480,
                    #f47fa2
                );

            color: white;

            padding: 14px 30px;

            box-shadow:
                0 8px 20px
                rgba(231, 84, 128, 0.3);
        }


        #yesBtn:hover {

            transform: scale(1.08);
        }


        /* NO */

        #noBtn {

            background: #f2f2f2;

            color: #777;

            padding: 14px 30px;

            box-shadow:
                0 5px 15px
                rgba(0, 0, 0, 0.08);
        }


        /* =========================
           RESULT
        ========================= */

        .result {

            display: none;

            margin-top: 22px;

            color: #d94f7a;

            font-size: 19px;

            font-weight: bold;

            animation: pop 0.6s ease;
        }


        @keyframes pop {

            0% {
                transform: scale(0.5);
                opacity: 0;
            }

            80% {
                transform: scale(1.08);
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }


        /* =========================
           PHOTO AFTER YES
        ========================= */

        .date-photo {

            display: none;

            width: 100%;
            max-width: 300px;

            margin: 22px auto 5px;

            border-radius: 22px;

            border: 5px solid white;

            box-shadow:
                0 10px 30px
                rgba(180, 70, 110, 0.25);

            animation:
                photoAppear 0.8s ease;

            object-fit: cover;
        }


        @keyframes photoAppear {

            from {
                opacity: 0;

                transform:
                    scale(0.7)
                    rotate(-5deg);
            }

            to {
                opacity: 1;

                transform:
                    scale(1)
                    rotate(0);
            }
        }


        /* =========================
           SMALL TEXT
        ========================= */

        .small-text {

            margin-top: 20px;

            color: #aaa;

            font-size: 12px;
        }


        /* =========================
           HEART CELEBRATION
        ========================= */

        .celebration-heart {

            position: fixed;

            z-index: 20;

            pointer-events: none;

            font-size: 25px;

            animation:
                celebrate 2.5s ease-out forwards;
        }


        @keyframes celebrate {

            0% {

                transform:
                    translate(0, 0)
                    scale(0.5);

                opacity: 1;
            }

            100% {

                transform:
                    translate(
                        calc((var(--x) - 50) * 1vw),
                        calc((var(--y) - 50) * 1vh)
                    )
                    scale(1.5)
                    rotate(360deg);

                opacity: 0;
            }
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 480px) {

            .card {
                padding: 35px 20px;
            }

            h1 {
                font-size: 28px;
            }

            .subtitle {
                font-size: 14px;
            }

            .top-heart {

                width: 75px;
                height: 75px;

                font-size: 42px;
            }

            .date-photo {
                max-width: 270px;
            }
        }

    </style>

</head>


<body>


    <!-- FLOATING HEARTS -->

    <span class="heart">♡</span>
    <span class="heart">♡</span>
    <span class="heart">♡</span>
    <span class="heart">♡</span>
    <span class="heart">♡</span>
    <span class="heart">♡</span>


    <!-- MAIN CARD -->

    <div class="card">


        <div
            class="top-heart"
            id="topHeart"
        >
            💗
        </div>


        <h1 id="title">
            Will you be my date?
        </h1>


        <p
            class="subtitle"
            id="subtitle"
        >
            I have a little question for you... 🥺
            <br>
            Choose carefully. 💕
        </p>


        <!-- PICTURE THAT APPEARS AFTER YES -->

        <img
            id="datePhoto"
            class="date-photo"
            src="picture.jpeg"
            alt="Our picture"
        >


        <!-- BUTTONS -->

        <div class="buttons">


            <button
                id="yesBtn"
                onclick="sayYes()"
            >
                YES 💕
            </button>


            <button
                id="noBtn"
                onclick="clickNo()"
            >
                NO 😭
            </button>


        </div>


        <!-- SUCCESS MESSAGE -->

        <div
            class="result"
            id="result"
        >
            YAYYYY! 😭💗
            <br>
            It's a date! 🥰💐
        </div>


        <div class="small-text">
            made with a little bit of courage & lots of love ♡
        </div>


    </div>



    <script>


        let noClicks = 0;



        /* =========================
           YES BUTTON
        ========================= */

        function sayYes() {

            const yesBtn =
                document.getElementById("yesBtn");

            const noBtn =
                document.getElementById("noBtn");

            const result =
                document.getElementById("result");

            const photo =
                document.getElementById("datePhoto");


            /* CHANGE TEXT */

            document.getElementById("title").innerHTML =
                "YAYYYY! YOU SAID YES! 😭💗";


            document.getElementById("subtitle").innerHTML =
                "I knew you'd say yes! 🥰<br>" +
                "See you on our date! 💐";


            /* HIDE BUTTONS */

            yesBtn.style.display = "none";

            noBtn.style.display = "none";


            /* SHOW RESULT */

            result.style.display = "block";


            /* SHOW PICTURE */

            photo.style.display = "block";


            /* CHANGE HEART */

            document.getElementById("topHeart").innerHTML =
                "💖";


            /* HEART CONFETTI */

            createHearts();

        }



        /* =========================
           NO BUTTON
        ========================= */

        function clickNo() {

            noClicks++;


            const yesBtn =
                document.getElementById("yesBtn");

            const noBtn =
                document.getElementById("noBtn");



            /* =====================
               YES GETS BIGGER
            ===================== */

            let yesSize =
                16 + (noClicks * 2);


            let yesPaddingV =
                14 + (noClicks * 1.5);


            let yesPaddingH =
                30 + (noClicks * 2);


            yesBtn.style.fontSize =
                yesSize + "px";


            yesBtn.style.padding =
                yesPaddingV + "px " +
                yesPaddingH + "px";


            yesBtn.style.boxShadow =
                "0 0 " +
                (12 + noClicks * 2) +
                "px rgba(231,84,128,0.55)";



            /* =====================
               NO GETS SMALLER
            ===================== */

            let noSize =
                Math.max(
                    7,
                    16 - (noClicks * 0.6)
                );


            let noPaddingV =
                Math.max(
                    5,
                    14 - (noClicks * 0.5)
                );


            let noPaddingH =
                Math.max(
                    8,
                    30 - (noClicks * 1)
                );


            noBtn.style.fontSize =
                noSize + "px";


            noBtn.style.padding =
                noPaddingV + "px " +
                noPaddingH + "px";



            /* =====================
               NO TEXT CHANGES
            ===================== */

            const messages = [

                "Are you sure? 🥺",

                "Really? 💕",

                "Think again 😭",

                "Are you REALLY sure? 🥹",

                "Please? 🥺",

                "One more chance? 💗",

                "Don't do this 😭",

                "My heart 💔",

                "Why no? 🥲",

                "I'm waiting... 👀",

                "Still no? 😭",

                "You're sure? 🥺",

                "Come onnn 💕",

                "Last chance... 😭",

                "NO? REALLY? 💀"

            ];


            if (noClicks <= messages.length) {

                noBtn.innerHTML =
                    messages[noClicks - 1];

            } else {

                noBtn.innerHTML =
                    "no";
            }



            /* =====================
               NO RUNS AWAY
               AFTER 8 CLICKS
            ===================== */

            if (noClicks >= 8) {

                noBtn.style.position =
                    "fixed";


                noBtn.style.transition =
                    "all 0.5s ease";


                const maxX =
                    window.innerWidth -
                    noBtn.offsetWidth -
                    20;


                const maxY =
                    window.innerHeight -
                    noBtn.offsetHeight -
                    20;


                const randomX =
                    Math.max(
                        10,
                        Math.random() * maxX
                    );


                const randomY =
                    Math.max(
                        10,
                        Math.random() * maxY
                    );


                noBtn.style.left =
                    randomX + "px";


                noBtn.style.top =
                    randomY + "px";


                noBtn.style.transform =
                    "rotate(" +
                    (Math.random() * 20 - 10) +
                    "deg)";
            }



            /* =====================
               AFTER 15 CLICKS
            ===================== */

            if (noClicks >= 15) {

                noBtn.style.fontSize =
                    "6px";


                noBtn.style.padding =
                    "4px 7px";


                noBtn.innerHTML =
                    "no 😭";
            }

        }



        /* =========================
           HEART CELEBRATION
        ========================= */

        function createHearts() {

            const hearts = [

                "💗",
                "💕",
                "💖",
                "💓",
                "💘",
                "💝",
                "🌸"

            ];


            for (let i = 0; i < 35; i++) {

                const heart =
                    document.createElement("div");


                heart.className =
                    "celebration-heart";


                heart.innerHTML =
                    hearts[
                        Math.floor(
                            Math.random() *
                            hearts.length
                        )
                    ];


                heart.style.left =
                    Math.random() * 100 + "vw";


                heart.style.top =
                    Math.random() * 100 + "vh";


                heart.style.setProperty(
                    "--x",
                    Math.random() * 100
                );


                heart.style.setProperty(
                    "--y",
                    Math.random() * 100
                );


                heart.style.animationDelay =
                    Math.random() * 0.5 + "s";


                document.body.appendChild(
                    heart
                );


                setTimeout(() => {

                    heart.remove();

                }, 3000);

            }

        }

    </script>

</body>

</html>
